spring:
  cloud:
    function:
      definition: digitalDeliveryConsumer
    stream:
      bindings:
        digitalDeliveryConsumer-in-0:
          destination: digital-delivery
          group: digital-delivery-service
      kafka:
        binder:
          brokers:
            - localhost:9092
          autoCreateTopics: false
          consumer-properties:
            auto.offset.reset: earliest