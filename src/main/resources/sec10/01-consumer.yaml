spring:
  cloud:
    function:
      definition: messageConsumer
    stream:
      bindings:
        messageConsumer-in-0:
          destination: demo-topic
          group: demo-group
          consumer:
            batch-mode: true
      kafka:
        binder:
          brokers:
            - localhost:9092
          autoCreateTopics: false
          consumer-properties:
            auto.offset.reset: earliest
            fetch.min.byte: 1024
            fetch.max.wait.ms: 500
            max.poll.records: 1000
