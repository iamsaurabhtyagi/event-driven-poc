spring:
  cloud:
    function:
      definition: consumerMessage
    stream:
      bindings:
        consumerMessage-in-0:
          destination: demo-events
          group: demo-group
      kafka:
        binder:
          brokers:
            - localhost:9092
          autoCreateTopics: false
          consumer-properties:
            auto.offset.reset: earliest # --from-beginning