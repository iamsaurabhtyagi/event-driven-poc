spring:
  cloud:
    function:
      definition: userMessageConsumer
    stream:
      bindings:
        userMessageConsumer-in-0:
          destination: demo-events
          group: demo-group
      kafka:
        binder:
          brokers:
            - localhost:9092
          autoCreateTopics: false
          consumer-properties:
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer